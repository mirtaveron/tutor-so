version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: os_uns_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: os_uns
    ports:
      - "5433:5432" # Expuesto en el 5433 para evitar conflictos con tu Postgres local
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
